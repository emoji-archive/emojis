<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emote Archive</title>

<style>
/* Layout: full-height app, titlebar + tabs + grid + statusbar */
:root {
  --bg: #1C1C1C;
  --bg-deep: #121212;
  --bg-panel: #161616;
  --bg-hover: #252525;
  --accent: #01F7E8;
  --accent-dim: #0a5f5a;
  --accent-glow: rgba(1,247,232,0.18);
  --text: #c8f5f2;
  --text-dim: #3a4a49;
  --text-mid: #6a9a97;
  --border: #1e3230;
  --titlebar-gradient: linear-gradient(0deg,
    rgba(0,0,0,1) 0%,
    rgba(0,0,0,1) 42%,
    rgba(20,20,20,1) 42%,
    rgba(184,178,178,1) 100%
  );
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Courier New", Courier, monospace;
}

body {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--accent-dim);
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* TITLEBAR */
#titlebar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 32px;
  padding: 0 10px;
  background: var(--titlebar-gradient);
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--accent);
  text-shadow: 0 0 4px rgba(1,247,232,0.5);
}

#titlebar-left {
  display: flex;
  align-items: center;
  gap: 6px;
}

#titlebar-dot {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 4px var(--accent);
  flex-shrink: 0;
}

#size-switch { display: flex; gap: 2px; }

.size-btn {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: var(--bg);
  color: var(--text-dim);
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  padding: 2px 6px;
  cursor: pointer;
  transition: color 0.1s, border-color 0.1s;
}
.size-btn:hover { color: var(--text); border-color: var(--accent); }
.size-btn.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }

/* TABS */
#tabbar {
  flex-shrink: 0;
  display: flex;
  align-items: stretch;
  height: 28px;
  background: var(--bg-deep);
  border-bottom: 1px solid var(--border);
  padding: 0 6px;
  gap: 2px;
}

.tab-btn {
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: none;
  color: var(--text-mid);
  border: none;
  border-bottom: 2px solid transparent;
  padding: 0 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.1s, border-color 0.1s;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  text-shadow: 0 0 6px rgba(1,247,232,0.4);
}
.tab-btn.fav-tab { color: #FFB300; }
.tab-btn.fav-tab.active {
  color: #FFB300;
  border-bottom-color: #FFB300;
  text-shadow: 0 0 6px rgba(255,179,0,0.4);
}

/* COMBO BAR */
#combobar {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  min-height: 28px;
  padding: 4px 6px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}
#combo-input {
  flex: 1;
  min-width: 120px;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.3px;
  background: var(--bg-deep);
  color: var(--text);
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  padding: 2px 6px;
  height: 20px;
  outline: none;
  cursor: text;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
#combo-input:focus { border-color: var(--accent); }
#combo-input::placeholder { color: var(--text-dim); }
@media (max-width: 500px) {
  #combo-input {
    order: 10;
    flex: 1 0 100%;
    min-width: 0;
  }
  #btn-combo-clear {
    margin-left: auto;
  }
}
#btn-combo-copy {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: none;
  color: var(--text-dim);
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  padding: 2px 7px;
  height: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.1s, border-color 0.1s, background 0.1s;
}
#btn-combo-copy:hover { color: var(--text); border-color: var(--accent); }
#btn-combo-copy.copied { color: var(--bg); background: var(--accent); border-color: var(--accent); }
#btn-combo-clear {
  font-family: inherit;
  font-size: 13px;
  line-height: 1;
  background: none;
  color: var(--text-dim);
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  padding: 1px 6px;
  height: 20px;
  cursor: pointer;
  transition: color 0.1s, border-color 0.1s;
}
#btn-combo-fav {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: none;
  color: var(--text-dim);
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  padding: 2px 7px;
  height: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.1s, border-color 0.1s, background 0.1s;
}
#btn-combo-fav:hover { color: #FFB300; border-color: #FFB300; }
#btn-combo-fav.added { color: var(--bg); background: #FFB300; border-color: #FFB300; }

#btn-combo-clear:hover { color: #ff5555; border-color: #ff5555; }

/* GRID */
#grid-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
}
#grid-wrap::-webkit-scrollbar { width: 6px; }
#grid-wrap::-webkit-scrollbar-track { background: var(--bg-deep); }
#grid-wrap::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

#grid {
  display: grid;
  gap: 2px;
  padding: 6px;
}

.emote-cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
  aspect-ratio: 1/1;
  transition: border-color 0.1s, box-shadow 0.1s;
}
.emote-cell:hover {
  border-color: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
}
.emote-cell img {
  max-width: calc(100% - 6px);
  max-height: calc(100% - 6px);
  image-rendering: pixelated;
  display: block;
}

/* FAV TAB */
#fav-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  display: none;
  padding: 6px;
}
#fav-wrap.active { display: block; }
#fav-wrap::-webkit-scrollbar { width: 6px; }
#fav-wrap::-webkit-scrollbar-track { background: var(--bg-deep); }
#fav-wrap::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

.fav-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 4px;
}

.fav-box {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  border: 1px solid var(--accent-dim);
  border-radius: 3px;
  padding: 2px 3px;
  background: var(--bg-panel);
  cursor: pointer;

  transition: border-color 0.1s, box-shadow 0.1s;
  position: relative;
  margin-top: 7px;
  margin-right: 7px;
}
.fav-box:hover {
  border-color: var(--accent);
  box-shadow: 0 0 5px var(--accent-glow);
}
.fav-box--link {
  border-color: #FFB300;
  gap: 5px;
  padding: 3px 6px;
}
.fav-box--link:hover {
  border-color: #ffd04d;
  box-shadow: 0 0 6px rgba(255,179,0,0.5);
}
.fav-link-label {
  font-size: 10px;
  color: var(--text-dim);
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fav-box img {
  image-rendering: pixelated;
  display: block;
  flex-shrink: 0;
  max-height: var(--fav-h, 28px);
  width: auto;
}
.fav-box .fav-emoji {
  font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.fav-box .fav-del {
  position: absolute;
  top: -5px;
  left: -5px;
  width: 13px;
  height: 13px;
  background: #e8735a;
  border: 1px solid #ff9a82;
  border-radius: 50%;
  font-size: 8px;
  line-height: 1;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  box-shadow: 0 0 5px rgba(232,115,90,0.7);
}
.fav-del:hover {
  background: #ff5a3a;
  border-color: #ffaa90;
  box-shadow: 0 0 8px rgba(255,90,58,0.9);
}

.copy-flash {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(1,247,232,0.15);
  border-radius: 2px;
  font-size: 7px;
  color: var(--accent);
  letter-spacing: 0.5px;
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}
@keyframes flash {
  0%  { opacity: 1; }
  60% { opacity: 1; }
  100%{ opacity: 0; }
}
.copy-flash.show { animation: flash 0.6s ease-out forwards; }

/* TOOLTIP */
#tooltip {
  position: fixed;
  background: var(--bg-deep);
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  font-size: 12px;
  letter-spacing: 0.5px;
  padding: 3px 7px;
  border-radius: 2px;
  pointer-events: none;
  white-space: nowrap;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.8s;
}
#tooltip.visible { opacity: 1; transition: opacity 0.1s; }

/* UTF TAB */
#utf-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  display: none;
}
#utf-wrap.active { display: block; }
#utf-wrap::-webkit-scrollbar { width: 6px; }
#utf-wrap::-webkit-scrollbar-track { background: var(--bg-deep); }
#utf-wrap::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

.utf-category {
  padding: 6px 8px 2px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}

.utf-row {
  display: flex;
  flex-wrap: wrap;
  gap: 1px;
  padding: 2px 4px 4px;
}

.utf-cell {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  cursor: pointer;
  border-radius: 2px;
  border: 1px solid transparent;
  transition: border-color 0.1s, box-shadow 0.1s;
  position: relative;
  user-select: none;
}
.utf-cell:hover {
  border-color: var(--accent);
  box-shadow: 0 0 5px var(--accent-glow);
}
.utf-cell.big {
  width: 48px;
  height: 48px;
  font-size: 30px;
}
.utf-cell.huge {
  width: 72px;
  height: 72px;
  font-size: 46px;
}

/* EMPTY STATE */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 40px;
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: 0.5px;
  text-align: center;
}
.empty-icon { font-size: 24px; opacity: 0.4; }

/* STATUSBAR */
#statusbar {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  background: var(--bg-deep);
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}
#statusbar-center {
  text-align: center;
}
#fav-actions {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
}

#status-count { flex: 1; }

#fav-actions { display: flex; gap: 4px; }

.bar-btn {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: none;
  color: var(--text-dim);
  border: 1px solid var(--accent-dim);
  border-radius: 2px;
  padding: 2px 6px;
  cursor: pointer;
  transition: color 0.1s, border-color 0.1s;
  display: inline-flex;
  align-items: center;
}
.bar-btn:hover { color: var(--text); border-color: var(--accent); }
</style>

const grid = document.getElementById('grid');

let tooltipTimer = null;
let copyBtnTimer = null;

// ── INIT ──
function init() {
  loadState();
  renderTab(currentTab);
  bindEvents();
}

// ── RENDER ──
const utfWrap = document.getElementById('utf-wrap');

function renderTab(tabId) {
  currentTab = tabId;
  comboInput.setAttribute('readonly', '');
  comboInput.placeholder = 'click emotes to build a combo...';

  // ustaw aktywny przycisk zakładki
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tabId)
  );

  // przełącz widoki
  gridWrap.style.display = 'none';
  utfWrap.classList.remove('active');
  favWrap.classList.remove('active');

  if (tabId === 'utf') {
    utfWrap.classList.add('active');
    renderUtf();
    const total = UTF_CATS.reduce((s, c) => s + [...c.emojis].length, 0);
    statusCount.textContent = total + ' emoji';
    return;
  }

  if (tabId === 'favorites') {
    favWrap.classList.add('active');
    renderFav();
    statusCount.textContent = favorites.length + ' combos';
    if (combo.length) {
      comboInput.setAttribute('readonly', '');
      comboInput.placeholder = 'click emotes to build a combo...';
    } else {
      comboInput.removeAttribute('readonly');
      comboInput.placeholder = 'paste image URL to add to fav...';
      comboInput.value = '';
    }
    return;
  }

  gridWrap.style.display = '';
  grid.innerHTML = '';

  grid.style.gridTemplateColumns = 'repeat(auto-fill, ' + currentSize + 'px)';

  const tab = TABS[tabId];
  if (!tab) return;
  const items = tab.items.map(item => ({ ...item, base: tab.base, tabId: tabId }));

  const frag = document.createDocumentFragment();
  for (const item of items) {
    const cell = document.createElement('div');
    cell.className = 'emote-cell';
    cell.dataset.label = item.label;
    cell.dataset.url = SITE_BASE + item.base + item.file;

    const img = document.createElement('img');
    img.src = item.base + item.file;
    img.alt = item.label;
    img.loading = 'lazy';

    const flash = document.createElement('div');
    flash.className = 'copy-flash';
    flash.textContent = 'ok';

    cell.appendChild(img);
    cell.appendChild(flash);
    frag.appendChild(cell);
  }
  grid.appendChild(frag);
  statusCount.textContent = items.length + ' emotes';
}
function bindEvents() {
  // taby
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTab(btn.dataset.tab);
      saveState();
    });
  });

  // rozmiar
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSize = Number(btn.dataset.size);
      document.querySelectorAll('.size-btn').forEach(b =>
        b.classList.toggle('active', Number(b.dataset.size) === currentSize)
      );
      renderTab(currentTab);
      applyUtfSize(currentSize);
      saveState();
    });
  });

  // klik na grid (delegacja)
  grid.addEventListener('click', (e) => {
    const cell = e.target.closest('.emote-cell');
    if (!cell) return;
    const url = cell.dataset.url;
    navigator.clipboard.writeText(url).catch(() => {});
    comboAdd(url);
    clearTimeout(copyBtnTimer);
    btnComboCopy.classList.add('copied');
    btnComboCopy.innerHTML = '** copied **';
    copyBtnTimer = setTimeout(() => {
      btnComboCopy.classList.remove('copied');
      btnComboCopy.innerHTML = '&#9112; copy combo';
    }, 3000);
    const flash = cell.querySelector('.copy-flash');
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');
  });


  // tooltip on tap (mobile)
  let touchStartY = 0;
  const hideTip = () => { clearTimeout(tooltipTimer); tooltip.classList.remove('visible'); };
  grid.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  grid.addEventListener('touchend', (e) => {
    const cell = e.target.closest('.emote-cell');
    if (!cell) return;
    if (Math.abs(e.changedTouches[0].clientY - touchStartY) > 8) return;
    const t = e.changedTouches[0];
    tooltip.textContent = cell.dataset.label;
    tooltip.style.left = (t.clientX + 12) + 'px';
    tooltip.style.top  = (t.clientY - 36) + 'px';
    tooltip.classList.add('visible');
    clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(hideTip, 3000);
  }, { passive: true });
  gridWrap.addEventListener('scroll', hideTip, { passive: true });
  // tooltip (desktop mouse only)
  let hasTouch = false;
  window.addEventListener('touchstart', () => { hasTouch = true; }, { once: true, passive: true });
  grid.addEventListener('mouseover', (e) => {
    if (hasTouch) return;
    const cell = e.target.closest('.emote-cell');
    if (!cell) return;
    tooltip.textContent = cell.dataset.label;
    tooltip.classList.add('visible');
  });
  grid.addEventListener('mousemove', (e) => {
    if (hasTouch) return;
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top  = (e.clientY - 24) + 'px';
  });
  grid.addEventListener('mouseout', (e) => {
    if (hasTouch) return;
    if (!e.target.closest('.emote-cell')) return;
    tooltip.classList.remove('visible');
  });

  // export
  document.getElementById('btn-export').addEventListener('click', () => {
    const data = JSON.stringify(favorites, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'your-emote-favorites.json'; a.click();
    URL.revokeObjectURL(url);
  });

  // import
  document.getElementById('import-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const arr = JSON.parse(ev.target.result);
        if (Array.isArray(arr)) { favorites = arr; saveState(); renderTab(currentTab); }
      } catch {}
    };
    reader.readAsText(file);
    e.target.value = '';
  });
}

// ── UTF RENDER ──
let utfRendered = false;

function renderUtf() {
  if (utfRendered) { applyUtfSize(currentSize); return; }
  utfRendered = true;
  const frag = document.createDocumentFragment();
  for (const cat of UTF_CATS) {
    const hdr = document.createElement('div');
    hdr.className = 'utf-category';
    hdr.textContent = cat.name;
    frag.appendChild(hdr);

    const row = document.createElement('div');
    row.className = 'utf-row';

    const seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
    const chars = [...seg.segment(cat.emojis)].map(s => s.segment);
    for (const ch of chars) {
      const cell = document.createElement('div');
      cell.className = 'utf-cell';
      cell.textContent = ch;
      cell.dataset.emoji = ch;
      row.appendChild(cell);
    }
    frag.appendChild(row);
  }
  utfWrap.appendChild(frag);
  applyUtfSize(currentSize);

  // event delegation na utfWrap
  utfWrap.addEventListener('click', (e) => {
    const cell = e.target.closest('.utf-cell');
    if (!cell) return;
    const ch = cell.dataset.emoji;
    navigator.clipboard.writeText(ch).catch(() => {});
    comboAdd(ch);
    clearTimeout(copyBtnTimer);
    btnComboCopy.classList.add('copied');
    btnComboCopy.innerHTML = '** copied **';
    copyBtnTimer = setTimeout(() => {
      btnComboCopy.classList.remove('copied');
      btnComboCopy.innerHTML = '&#9112; copy combo';
    }, 3000);
    // flash
    cell.style.background = 'var(--accent-glow)';
    setTimeout(() => cell.style.background = '', 400);
  });

  utfWrap.addEventListener('mouseover', (e) => {
    const cell = e.target.closest('.utf-cell');
    if (!cell) return;
    const cp = [...cell.dataset.emoji].map(c => 'U+' + c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0')).join(' ');
    tooltip.textContent = cp;
    tooltip.classList.add('visible');
  });
  utfWrap.addEventListener('mousemove', (e) => {
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top  = (e.clientY - 24) + 'px';
  });
  utfWrap.addEventListener('mouseout', (e) => {
    if (!e.target.closest('.utf-cell')) return;
    tooltip.classList.remove('visible');
  });
}

// rozmiar dla utf-cell
function applyUtfSize(size) {
  document.querySelectorAll('.utf-cell').forEach(c => {
    c.classList.toggle('big', size === 42);
    c.classList.toggle('huge', size === 64);
  });
}

// ── COMBO ──
let combo = [];
const comboInput = document.getElementById('combo-input');
const btnComboCopy = document.getElementById('btn-combo-copy');
const btnComboClear = document.getElementById('btn-combo-clear');

function comboAdd(url) {
  combo.push(url);
  comboInput.value = combo.join(' ');
  comboInput.scrollLeft = comboInput.scrollWidth;
}

function comboClear() {
  combo = [];
  comboInput.value = '';
  if (currentTab === 'favorites') {
    comboInput.removeAttribute('readonly');
    comboInput.placeholder = 'paste image URL to add to fav...';
  }
}

btnComboCopy.addEventListener('click', () => {
  if (!combo.length) return;
  navigator.clipboard.writeText(combo.join(' ')).catch(() => {});
  btnComboCopy.classList.add('copied');
  btnComboCopy.innerHTML = '** copied **';
  setTimeout(() => {
    btnComboCopy.classList.remove('copied');
    btnComboCopy.innerHTML = '&#9112; copy combo';
  }, 1200);
});

btnComboClear.addEventListener('click', comboClear);

const btnComboFav = document.getElementById('btn-combo-fav');
btnComboFav.addEventListener('click', () => {
  // on favorites tab: add URL from input directly
  if (currentTab === 'favorites' && !combo.length) {
    const url = comboInput.value.trim();
    if (!url) return;
    favorites.push([url]);
    saveState();
    renderFav();
    comboInput.value = '';
    btnComboFav.classList.add('added');
    btnComboFav.innerHTML = '&#10003; add to fav';
    setTimeout(() => {
      btnComboFav.classList.remove('added');
      btnComboFav.innerHTML = '&#9733; add to fav';
    }, 1200);
    return;
  }
  if (!combo.length) return;
  favorites.push([...combo]);
  saveState();
  if (currentTab === 'favorites') renderFav();
  btnComboFav.classList.add('added');
  btnComboFav.innerHTML = '&#10003; add to fav';
  setTimeout(() => {
    btnComboFav.classList.remove('added');
    btnComboFav.innerHTML = '&#9733; add to fav';
  }, 1200);
});

// ── FAV CLICK (raz na zawsze) ──
favWrap.addEventListener('click', (e) => {
  const del = e.target.closest('.fav-del');
  if (del) {
    e.stopPropagation();
    const i = Number(del.dataset.idx);
    favorites.splice(i, 1);
    saveState();
    renderFav();
    statusCount.textContent = favorites.length + ' combos';
    return;
  }
  const box = e.target.closest('.fav-box');
  if (!box) return;
  const i = Number(box.dataset.idx);
  const urls = favorites[i];
  for (const url of urls) comboAdd(url);
  navigator.clipboard.writeText(urls.join(' ')).catch(() => {});
  clearTimeout(copyBtnTimer);
  btnComboCopy.classList.add('copied');
  btnComboCopy.innerHTML = '** copied **';
  copyBtnTimer = setTimeout(() => {
    btnComboCopy.classList.remove('copied');
    btnComboCopy.innerHTML = '&#9112; copy combo';
  }, 3000);
  box.style.boxShadow = '0 0 8px var(--accent)';
  setTimeout(() => box.style.boxShadow = '', 500);
});

// ── FAV RENDER ──
function renderFav() {
  favWrap.style.setProperty('--fav-h', currentSize + 'px');
  favWrap.innerHTML = '';
  if (!favorites.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<span class="empty-icon">\u2605</span><span>no favorites yet</span><span style="font-size:9px">use combo + add to fav</span>';
    favWrap.appendChild(empty);
    return;
  }
  const frag = document.createDocumentFragment();
  favorites.forEach((comboArr, idx) => {
    const box = document.createElement('div');
    box.className = 'fav-box';
    box.dataset.idx = idx;
    box.title = comboArr.join(' ');

    // single external URL — image or generic link?
    const isExternal = comboArr.length === 1 &&
      /^https?:\/\//.test(comboArr[0]) &&
      !comboArr[0].startsWith(SITE_BASE);
    const isImageUrl = isExternal &&
      /\.(gif|png|jpe?g|webp|svg|avif)(\?.*)?$/i.test(comboArr[0]);
    if (isExternal && !isImageUrl) {
      box.classList.add('fav-box--link');
      const url = comboArr[0];
      let domain;
      try { domain = new URL(url).hostname; } catch(e) { domain = url; }
      const fav = document.createElement('img');
      fav.src = 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=32';
      fav.width = 16; fav.height = 16;
      fav.alt = '';
      fav.style.imageRendering = 'pixelated';
      const lbl = document.createElement('span');
      lbl.className = 'fav-link-label';
      lbl.textContent = domain;
      box.appendChild(fav);
      box.appendChild(lbl);
    } else
    for (const url of comboArr) {
      if (url.includes('/')) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = url;
        img.loading = 'lazy';
        box.appendChild(img);
      } else {
        const sp = document.createElement('span');
        sp.className = 'fav-emoji';
        sp.textContent = url;
        sp.style.width = currentSize + 'px';
        sp.style.height = currentSize + 'px';
        sp.style.fontSize = Math.round(currentSize * 0.72) + 'px';
        box.appendChild(sp);
      }
    }

    const del = document.createElement('button');
    del.className = 'fav-del';
    del.textContent = '\u00d7';
    del.dataset.idx = idx;
    box.appendChild(del);
    frag.appendChild(box);
  });

  // row wrapper
  const row = document.createElement('div');
  row.className = 'fav-row';
  row.appendChild(frag);
  favWrap.appendChild(row);
}

// ── PERSISTENCE ──
function saveState() {
  try { localStorage.setItem('emote-favs', JSON.stringify(favorites)); } catch {}
  try { localStorage.setItem('emote-size', currentSize); } catch {}
  try { localStorage.setItem('emote-tab', currentTab); } catch {}
}
function loadState() {
  try {
    const f = localStorage.getItem('emote-favs');
    if (f) {
      const parsed = JSON.parse(f);
      // obsługa starego formatu (Set/array stringów) i nowego (array of arrays)
      if (Array.isArray(parsed) && parsed.length && Array.isArray(parsed[0])) {
        favorites = parsed;
      } else {
        favorites = DEFAULT_FAVS.map(a => [...a]);
      }
    } else {
      favorites = DEFAULT_FAVS.map(a => [...a]);
    }
  } catch {
    favorites = DEFAULT_FAVS.map(a => [...a]);
  }
  try {
    const s = Number(localStorage.getItem('emote-size'));
    if (s === 28 || s === 42 || s === 64) {
      currentSize = s;
      document.querySelectorAll('.size-btn').forEach(btn =>
        btn.classList.toggle('active', Number(btn.dataset.size) === currentSize)
      );
    }
  } catch {}
  try {
    const t = localStorage.getItem('emote-tab');
    if (t) {
      // sprawdź czy taka zakładka istnieje
      const validTabs = [...Object.keys(TABS), 'utf', 'favorites'];
      if (validTabs.includes(t)) currentTab = t;
    }
  } catch {}
}

init();
</script>
